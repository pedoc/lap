function gallery(){return `<div class="app-title"><span>◉ &nbsp; Lap</span><span class="win-buttons">−　□　×</span></div><div class="app-body"><nav class="app-rail">${['home','image','folder','search','tag','calendar','chat','settings'].map(n=>`<button class="nav-icon ghost ${n==='chat'?'soft':''}" title="${n==='chat'?'媒体对话':n}">${icon(n)}</button>`).join('')}</nav><aside class="album-nav"><h3>我的照片 &nbsp;⌄</h3><div class="selected">全部媒体</div><div>收藏</div><div>相册</div><div>旅行</div><div>　杭州周末</div><div>　山湖之旅</div></aside><main class="gallery"><div class="gallery-head row between"><div><h2>杭州周末</h2><p class="muted small" style="margin-top:7px">2026 年 10 月 · 24 项媒体</p></div><button class="soft" data-view="chat">${icon('chat')} 与所选 3 项对话</button></div><div class="gallery-grid">${Array.from({length:16},(_,i)=>`<div class="gallery-tile photo-${i%3} ${i<3?'selected':''}">${image(media[i%3].photo)}${i<3?'<span class="tick">✓</span>':''}<span class="gallery-caption">${i%3===2?'▶　01:24':''}</span></div>`).join('')}</div></main></div><div class="gallery-footer">已选择 3 项 &nbsp; · &nbsp; 2 张照片 / 1 个视频</div>`}
function sessions(compact){return `<aside class="sessions"><button class="primary" data-view="attach">${icon('plus')} 新建会话</button><div class="session-search">${icon('search')} 搜索会话</div><div><div class="session-group">今天</div>${compact?'<div class="session active">新会话<span>刚刚 · 2 项媒体</span></div>':''}<div class="session ${compact?'':'active'}">杭州周末的三段记忆<span>14:26 · 3 项媒体</span></div><div class="session">为旅行照片整理标题<span>11:08 · 8 项媒体</span></div><div class="session">这些照片拍在哪里？</div><div class="session-group" style="margin-top:20px">昨天</div><div class="session">湖边视频里发生了什么？</div><div class="session">挑选一组适合分享的照片</div></div><div class="session-footer row">${icon('folder')} 当前资料库：我的照片</div></aside>`}
function rail(){return `<aside class="media-rail"><h3>会话媒体 <span data-scope-count>3</span></h3><div class="media-list">${media.map((m,i)=>`<article class="media-card" data-attachment><div class="media-cover">${image(m.photo)}<input type="checkbox" class="check" checked aria-label="引用${m.name}"><button class="remove" data-remove aria-label="从会话移除${m.name}">×</button>${m.video?'<span class="duration">▶ 01:24</span>':''}</div><p>[${i+1}] ${m.name}</p></article>`).join('')}</div><div class="drop-zone" data-drop>${icon('image')}<span>拖入图片或视频</span><button data-add>或从本地添加</button></div><p class="rail-note">会话媒体用于提问和资料建议。<br>移出会话不删除原媒体。</p></aside>`}
function conversation(){return `<div class="conversation"><article class="user-message"><div class="message-attachments">${media.map((m,i)=>`<div class="message-media">${image(m.photo)}<span class="media-index">[${i+1}] ${m.video?'▶':''}</span></div>`).join('')}</div><p>对比这三项媒体，帮我概括这次出游，并给每一项起个自然的标题。</p></article><article><div class="assistant-mark"><span class="mark">${icon('spark')}</span> 媒体助手 <span class="muted tiny" style="font-weight:400">· 已有分析</span></div><p class="assistant-text">这组媒体记录了从湖边散步到朋友合影的轻松周末。画面整体以湖水、绿树和自然光为主。</p><div class="answer-list">${['沿着湖岸慢慢走','把周末留在合影里','一段湖边的慢时光'].map((t,i)=>`<div class="answer-item"><span class="answer-no">${i+1}</span><div><strong style="font-weight:600">${t}</strong><br><span class="citation">${icon(i===2?'play':'image')} [${i+1}] ${i===2?'视频 00:12–00:26':media[i].name}</span></div></div>`).join('')}</div><p class="assistant-text">这些标题保留轻松、自然的语气；你也可以继续告诉我希望突出的人物或细节。</p><div class="message-actions"><button class="icon-button ghost" title="复制">${icon('copy')}</button><button class="icon-button ghost" title="重新生成">${icon('refresh')}</button><button class="btn-mini soft" data-view="review">${icon('spark')} 生成资料建议</button></div></article></div>`}
function attachEmpty(){return `<div class="conversation"><div class="empty-icon">${icon('chat')}</div><h2 class="empty-title">和你的照片、视频聊聊</h2><p class="empty-copy">拖入媒体，或从资料库选择后开始提问。<br>会话会保留每一轮的问题、回答和引用媒体。</p><div class="starter-chips"><button data-prompt="这些画面讲了什么？">这些画面讲了什么？</button><button data-prompt="对比这些媒体的内容与氛围。">比较几张照片</button><button data-view="review">整理标题和标签</button></div><div class="drop-zone" data-drop>${icon('image')}<span>继续拖入图片或视频</span><button data-add>或点击下方“附加媒体”</button></div></div>`}
function composer(compact){const cards=compact?`<div class="attachment-tray">${[media[0],media[2]].map((m,i)=>`<div class="attach-card" data-attachment>${image(m.photo)}<div><p class="truncate">[${i+1}] ${m.name}</p><span>${m.video?'▶ 01:24 · ':''}准备就绪</span></div><button class="remove" data-remove aria-label="移除附件">×</button></div>`).join('')}</div>`:'';return `<div class="composer-wrap">${cards}<div class="composer-scope"><span class="scope-chip">${icon('image')} 本轮引用 <span data-scope-count>${compact?2:3}</span> 项 ⌄</span>${compact?'<span>引用会话中的其他媒体</span>':'<div class="modes"><button class="active" data-mode>已有分析</button><button data-mode>复核画面</button></div>'}</div><div class="composer"><textarea aria-label="向媒体助手提问" placeholder="继续提问，或拖入媒体…">${compact?'这张照片和视频分别展示了什么？':''}</textarea><div class="composer-bottom"><button class="ghost" data-add>${icon('clip')} 附加媒体</button><button class="primary send" data-send aria-label="发送">${icon('send')}${compact?'发送':''}</button></div></div><div class="quick-actions"><span>快捷操作</span><button data-view="review">填充标题</button><button data-view="review">补充说明</button><button data-view="review">建议标签</button></div></div>`}
function reviewDialog(){return `<div class="review-backdrop"><section class="review-dialog" role="dialog" aria-label="预览并写回资料"><header class="review-title row between"><div><h2>预览并写回资料</h2><p>杭州周末的三段记忆 · 已选择 3 项媒体</p></div><button class="ghost icon-button" data-view="chat" aria-label="关闭预览">${icon('close')}</button></header><div class="review-policies"><div class="field-checks">${['标题','说明','标签'].map(t=>`<label><input class="check" type="checkbox" checked>${t}</label>`).join('')}</div><div class="policy-row"><select aria-label="标题说明覆盖规则"><option>标题／说明：仅填空白</option><option>覆盖已选字段</option></select><span>标签：追加并去重</span><label><input class="check" type="checkbox">允许创建新标签</label></div><p class="tiny muted">每一项建议都可以修改，确认后写入 Lap 媒体资料。</p></div><div class="review-scroll"><div class="review-grid-head"><span>媒体</span><span>当前资料</span><span>将采用的建议</span></div>${media.map((m,i)=>`<article class="review-row"><div class="review-media"><input type="checkbox" class="check" checked>${image(m.photo)}<div>${m.name}<br><span class="muted tiny">${m.video?'▶ 01:24':'照片'}</span></div></div><div class="review-current">标题：<strong>${i===1?'朋友的周末合影':'未填写'}</strong><br>说明：未填写<br><div>${(i===1?['朋友','旅行']:i===0?['旅行']:[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="proposal"><input aria-label="${m.name}建议标题" value="${['沿着湖岸慢慢走','朋友的周末合影','一段湖边的慢时光'][i]}" ${i===1?'disabled':''}>${i===1?'<span class="keep-label">已有标题，保留</span>':''}<textarea aria-label="${m.name}建议说明">${['树荫下的步道沿着湖面延伸，适合放慢脚步。','几位朋友在湖边留下合影，记录这次轻松的出游。','沿着湖岸边走边看，记录水面、绿树和同行的人。'][i]}</textarea><div>${(i===1?['合影','湖泊']:i===0?['旅行','湖泊','散步']:['湖泊','散步','视频']).map(t=>`<span class="tag">${t}</span>`).join('')}${m.video?'<span class="tiny muted">　引用片段 00:12–00:26</span>':''}</div></div></article>`).join('')}</div><footer class="review-footer"><div><strong>将更新 3 项媒体</strong><p>标题／说明仅填空白 · 标签追加去重</p></div><div class="row"><button data-view="chat">返回对话</button><button class="primary" data-apply>应用到 3 项媒体</button></div></footer><p class="review-note">保存到 Lap，不更改原文件名。</p></section></div>`}
function scene(mode){const compact=mode==='attach';return `<div class="stage ${compact?'compact':''} ${mode==='review'?'review':''}">${gallery()}<section class="chat-window"><div class="native-title">${icon('chat')} 媒体对话 <span class="grow"></span><span class="muted tiny">会话保存在本机</span><span class="win-buttons">−　□　×</span></div><div class="chat-layout">${sessions(compact)}<main class="chat-main"><header class="chat-head"><div class="grow"><h2>${compact?'新会话':'杭州周末的三段记忆'}</h2><p class="tiny muted">${compact?'附加媒体后开始提问':'3 项媒体 · 会话已保存'}</p></div><button class="model">媒体理解模型 ⌄</button><button class="ghost icon-button" title="更多">${icon('more')}</button></header>${compact?attachEmpty():conversation()}${composer(compact)}</main>${compact?'':rail()}</div>${mode==='review'?reviewDialog():''}</section><input type="file" accept="image/*,video/*" multiple hidden id="filePicker"><div class="toast" hidden role="status"></div></div>`}
if(screen){document.body.className='screen';document.getElementById('root').innerHTML=scene(['chat','attach','review'].includes(screen)?screen:'chat')}else{document.getElementById('root').innerHTML=`<header class="preview-head"><div><h1>Lap · 媒体对话设计预览</h1><p>独立聊天窗口 · 多媒体附件 · 会话历史 · 资料建议写回</p></div><nav class="preview-nav"><a href="?view=chat" data-preview="chat">1　会话窗口</a><a href="?view=attach" data-preview="attach">2　附加媒体</a><a href="?view=review" data-preview="review">3　写回预览</a></nav></header><main class="preview-wrap"><iframe class="preview-frame" title="媒体对话交互设计" id="previewFrame"></iframe><div class="downloads"><a href="01-chat.png" target="_blank">打开会话窗口 PNG</a><a href="02-attach.png" target="_blank">打开附加媒体 PNG</a><a href="03-review.png" target="_blank">打开写回预览 PNG</a></div><section class="notes"><strong>设计说明（不属于产品界面）</strong><ol><li>工具栏、左侧导航和右键菜单统一进入媒体对话；已有聊天窗口直接复用。</li><li>会话归属一个资料库，问题、回答以及当轮引用媒体形成可恢复的历史记录。</li><li>拖入、从所选媒体发送、附件按钮是等价入口；移除附件只影响后续提问，不删除原媒体。</li><li>标题／说明默认仅填空白，标签追加去重；先逐项预览，再明确应用。</li></ol><p>这是离线交互原型。发送和写回按钮仅展示交互反馈，不连接模型、不修改资料库。示例照片来源见 <a href="assets/SOURCES.md">SOURCES.md</a>。</p></section></main>`;const active=params.get('view')||'chat';document.querySelectorAll('[data-preview]').forEach(a=>a.classList.toggle('active',a.dataset.preview===active));document.getElementById('previewFrame').src='index.html?screen='+active}
function toast(text){const e=document.querySelector('.toast');if(!e)return;e.textContent=text;e.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.hidden=true,3000)}
function updateScope(){const n=document.querySelectorAll('[data-attachment]').length;document.querySelectorAll('[data-scope-count]').forEach(e=>e.textContent=n)}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.view){location.search='?screen='+button.dataset.view;return}if(button.hasAttribute('data-add'))document.getElementById('filePicker').click();if(button.hasAttribute('data-remove')){button.closest('[data-attachment]').remove();updateScope()}if(button.hasAttribute('data-mode')){button.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button))}if(button.dataset.prompt)document.querySelector('.composer textarea').value=button.dataset.prompt;if(button.hasAttribute('data-send'))toast('交互原型：这里将发送本轮媒体与问题，并保存到会话。');if(button.hasAttribute('data-apply'))toast('交互原型：这里将写回已确认的媒体资料，当前未执行保存。')});
document.querySelectorAll('[data-drop]').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drop-active')});zone.addEventListener('dragleave',()=>zone.classList.remove('drop-active'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drop-active');toast(`已拖入 ${e.dataTransfer.files.length} 个文件（原型演示，不上传）。`)})});
document.getElementById('filePicker')?.addEventListener('change',e=>toast(`已选择 ${e.target.files.length} 个文件（原型演示，不上传）。`));
</script>
</body>
</html>
