function reviewDialog(){return `<div class="review-backdrop"><section class="review-dialog" role="dialog" aria-label="预览并写回资料"><header class="review-title row between"><div><h2>预览并写回资料</h2><p>杭州周末的三段记忆 · 已选择 3 项媒体</p></div><button class="ghost icon-button" data-view="chat" aria-label="关闭预览">${icon('close')}</button></header><div class="review-policies"><div class="field-checks">${['标题','说明','标签'].map(t=>`<label><input class="check" type="checkbox" checked>${t}</label>`).join('')}</div><div class="policy-row"><select aria-label="标题说明覆盖规则"><option>标题／说明：仅填空白</option><option>覆盖已选字段</option></select><span>标签：追加并去重</span><label><input class="check" type="checkbox">允许创建新标签</label></div><p class="tiny muted">每一项建议都可以修改，确认后写入 Lap 媒体资料。</p></div><div class="review-scroll"><div class="review-grid-head"><span>媒体</span><span>当前资料</span><span>将采用的建议</span></div>${media.map((m,i)=>`<article class="review-row"><div class="review-media"><input type="checkbox" class="check" checked>${image(m.photo)}<div>${m.name}<br><span class="muted tiny">${m.video?'▶ 01:24':'照片'}</span></div></div><div class="review-current">标题：<strong>${i===1?'朋友的周末合影':'未填写'}</strong><br>说明：未填写<br><div>${(i===1?['朋友','旅行']:i===0?['旅行']:[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="proposal"><input aria-label="${m.name}建议标题" value="${['沿着湖岸慢慢走','朋友的周末合影','一段湖边的慢时光'][i]}" ${i===1?'disabled':''}>${i===1?'<span class="keep-label">已有标题，保留</span>':''}<textarea aria-label="${m.name}建议说明">${['树荫下的步道沿着湖面延伸，适合放慢脚步。','几位朋友在湖边留下合影，记录这次轻松的出游。','沿着湖岸边走边看，记录水面、绿树和同行的人。'][i]}</textarea><div>${(i===1?['合影','湖泊']:i===0?['旅行','湖泊','散步']:['湖泊','散步','视频']).map(t=>`<span class="tag">${t}</span>`).join('')}${m.video?'<span class="tiny muted">　引用片段 00:12–00:26</span>':''}</div></div></article>`).join('')}</div><footer class="review-footer"><div><strong>将更新 3 项媒体</strong><p>标题／说明仅填空白 · 标签追加去重</p></div><div class="row"><button data-view="chat">返回对话</button><button class="primary" data-apply>应用到 3 项媒体</button></div></footer><p class="review-note">保存到 Lap，不更改原文件名。</p></section></div>`}
function viewer(){return `<div class="app-title"><span>◉ &nbsp; Lap · 湖边步道.jpg</span><span class="win-buttons">−　□　×</span></div><main class="viewer-stage"><header class="viewer-toolbar"><button class="ghost" data-view="entry">‹ 返回图库</button><span class="muted">湖边步道.jpg</span><span class="tiny muted">1 / 24</span><span class="grow"></span><button class="ghost">收藏</button><button class="ghost">信息</button><button class="soft" data-open-chat data-chat-entry="viewer">${icon('chat')} 聊天</button><span class="viewer-hint">当前媒体可加入会话</span></header><div class="viewer-photo">${image('lake')}</div><div class="viewer-filmstrip">${[...media,...media].map((m,i)=>`<div class="viewer-thumb ${i===0?'active':''}">${image(m.photo)}</div>`).join('')}</div></main>`}
function scene(mode){const compact=mode==='attach',isViewer=mode==='viewer',closed=mode==='entry'||isViewer;return `<div class="stage ${compact?'compact':''} ${mode==='review'?'review':''}">${isViewer?viewer():gallery()}<section class="chat-window" role="dialog" aria-modal="false" aria-label="媒体对话" ${closed?'hidden':''}><div class="native-title" data-drag-title>${icon('chat')} 媒体对话 <span class="grow"></span><span class="muted tiny">会话保存在本机</span><button data-expand-chat title="展开／还原">□</button><button data-close-chat title="关闭对话" aria-label="关闭对话">${icon('close')}</button></div><div class="chat-layout">${sessions(compact)}<main class="chat-main"><header class="chat-head"><div class="grow"><h2>${compact?'新会话':'杭州周末的三段记忆'}</h2><p class="tiny muted">${compact?'附加媒体后开始提问':'3 项媒体 · 会话已保存'}</p></div><button class="model" data-model-toggle aria-label="选择本会话模型"><span data-selected-model>gpt-6.1-sol</span> ⌄</button><button class="ghost icon-button" title="更多">${icon('more')}</button>${modelMenu()}</header>${isViewer?'<div class="current-media-bar"><span>当前查看：湖边步道.jpg</span><div class="row"><button data-reference-current>加入本轮</button><button data-view="attach">新建会话</button></div></div>':''}${compact?attachEmpty():conversation()}${composer(compact)}</main>${compact?'':rail()}</div><span class="resize-grip" title="拖动角落调整大小" aria-hidden="true"></span>${mode==='review'?reviewDialog():''}</section><input type="file" accept="image/*,video/*" multiple hidden id="filePicker"><div class="toast" hidden role="status"></div></div>`}
if(screen){document.body.className='screen';document.getElementById('root').innerHTML=scene(['chat','attach','review','entry','viewer'].includes(screen)?screen:'chat')}else{document.getElementById('root').innerHTML=`<header class="preview-head"><div><h1>Lap · 媒体对话设计预览 v2</h1><p>两个入口 · 可缩放对话框 · @ 文件引用 · 会话模型选择</p></div><nav class="preview-nav"><a href="?view=entry" data-preview="entry">图库入口</a><a href="?view=viewer" data-preview="viewer">查看页入口</a><a href="?view=chat" data-preview="chat">会话窗口</a><a href="?view=attach" data-preview="attach">@ 文件引用</a><a href="?view=review" data-preview="review">写回预览</a></nav></header><main class="preview-wrap"><iframe class="preview-frame" title="媒体对话交互设计" id="previewFrame"></iframe><div class="downloads"><a href="04-entry.png" target="_blank">图库入口 PNG</a><a href="05-viewer.png" target="_blank">查看页入口 PNG</a><a href="01-chat.png" target="_blank">会话窗口 PNG</a><a href="02-attach.png" target="_blank">@ 引用 PNG</a><a href="03-review.png" target="_blank">写回预览 PNG</a></div><section class="notes"><strong>设计说明（不属于产品界面）</strong><ol><li>只保留图库右下角、查看页工具栏两个入口；无独立侧栏聊天入口，信息面板旧入口撤下。</li><li>两处打开同一个非模态对话框。可以拖动标题栏、拖动右下角调整大小、展开／还原；位置与大小将作为本机界面偏好记住。</li><li>图库按钮恢复最近会话；查看页在已有会话上显示“当前查看”条，由用户选择加入本轮或新建会话。翻图不自动更换附件，未发送草稿保持。</li><li>@ 候选分为本会话、当前资料库；重名文件显示缩略图和文件夹。选中后插入引用片段并加入本轮，发送范围以“本轮引用”区为准。</li><li>模型在会话顶部选择，默认继承已配置的媒体理解模型；切换只作用于后续消息，历史回答保留原模型，全局服务配置和默认用途保持。</li><li>聊天只选择生成模型；复核画面要求对应图片／视频能力。文本模型可用于已有分析回答，Embedding 仍由后台检索使用。</li><li>标题／说明默认仅填空白，标签追加去重；逐项预览后应用。批量理解、索引及执行状态由会话内的任务入口承接。</li></ol><p>这是离线交互原型。@ 选择、模型切换、窗口缩放可试用；发送、任务和写回只展示反馈，不连接模型或修改资料库。示例照片来源见 <a href="assets/SOURCES.md">SOURCES.md</a>。</p></section></main>`;const active=params.get('view')||'entry';document.querySelectorAll('[data-preview]').forEach(a=>a.classList.toggle('active',a.dataset.preview===active));document.getElementById('previewFrame').src='index.html?screen='+active}
function toast(text){const e=document.querySelector('.toast');if(!e)return;e.textContent=text;e.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.hidden=true,3000)}
function scopeIds(){const ids=new Set();document.querySelectorAll('[data-attachment][data-file-id]').forEach(e=>{const check=e.querySelector('input[type=checkbox]');if(!check||check.checked)ids.add(e.dataset.fileId)});document.querySelectorAll('[data-editor] [data-mention-id]').forEach(e=>ids.add(e.dataset.mentionId));return ids}
function updateScope(){document.querySelectorAll('[data-scope-count]').forEach(e=>e.textContent=scopeIds().size);const total=document.querySelector('[data-session-count]');if(total)total.textContent=document.querySelectorAll('.media-list [data-attachment]').length}
function hideMentions(){const menu=document.querySelector('[data-mention-menu]');if(menu)menu.hidden=true}
function renderMentions(){const list=document.querySelector('.mention-results');if(!list)return;const query=document.querySelector('[data-mention-filter]').value.trim().toLowerCase();const rows=(mentionSource==='session'?media:libraryMedia).filter(m=>(m.name+' '+m.folder).toLowerCase().includes(query));mentionIndex=Math.max(0,Math.min(mentionIndex,rows.length-1));list.innerHTML=rows.length?rows.map((m,i)=>`<button class="mention-result ${i===mentionIndex?'active':''}" role="option" aria-selected="${i===mentionIndex}" data-reference-id="${m.id}">${image(m.photo)}<span class="grow"><strong>${m.name}</strong><small>${m.folder}${m.video?' · 01:24':''}</small></span><span class="pill">${m.video?'视频':'图片'}</span></button>`).join(''):'<p class="muted small" style="padding:14px 8px">没有匹配的文件，换个名称或文件夹试试。</p>'}
function openMentions(focusFilter=false){const menu=document.querySelector('[data-mention-menu]');if(!menu)return;document.querySelector('[data-model-menu]').hidden=true;menu.hidden=false;renderMentions();if(focusFilter)menu.querySelector('input').focus()}
function referenceFile(id){const m=libraryMedia.find(item=>item.id===id),editor=document.querySelector('[data-editor]');if(!m||!editor)return;const last=editor.lastChild;if(last?.nodeType===Node.TEXT_NODE)last.textContent=last.textContent.replace(/@[^\s@]*$/,'');const chip=document.createElement('span');chip.className='mention';chip.contentEditable='false';chip.dataset.mentionId=id;chip.textContent='@'+m.name;chip.title=m.folder+' / '+m.name;editor.append(chip,document.createTextNode(' '));const current=document.querySelector('[data-attachment][data-file-id="'+id+'"]');if(current){const check=current.querySelector('input');if(check)check.checked=true}else{document.querySelector('.media-list')?.insertAdjacentHTML('beforeend',`<article class="media-card" data-attachment data-file-id="${id}"><div class="media-cover">${image(m.photo)}<input type="checkbox" class="check" checked aria-label="本轮引用${m.name}"><button class="remove" data-remove aria-label="移除附件">×</button></div><p>${m.name}</p></article>`)}hideMentions();updateScope();editor.focus();const range=document.createRange();range.selectNodeContents(editor);range.collapse(false);const selection=getSelection();selection.removeAllRanges();selection.addRange(range)}
function refreshModelOptions(){document.querySelectorAll('[data-model-id]').forEach(button=>{const m=chatModels.find(model=>model.id===button.dataset.modelId);button.disabled=activeMode==='visual'&&!!m.textOnly;button.classList.toggle('selected',m===selectedChatModel);button.title=button.disabled?'复核画面需要具备图片／视频理解能力的模型':''})}
document.querySelector('.assistant-mark')?.insertAdjacentHTML('beforeend','<span class="answer-model" data-answer-model>· gpt-6.1-sol</span>');renderMentions();updateScope();refreshModelOptions();if(screen==='models')document.querySelector('[data-model-menu]').hidden=false;
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.view){location.search='?screen='+button.dataset.view;return}if(button.hasAttribute('data-open-chat')){document.querySelector('.chat-window').hidden=false;return}if(button.hasAttribute('data-close-chat')){document.querySelector('.chat-window').hidden=true;return}if(button.hasAttribute('data-expand-chat')){document.querySelector('.chat-window').classList.toggle('expanded');return}if(button.hasAttribute('data-model-toggle')){hideMentions();const menu=document.querySelector('[data-model-menu]');menu.hidden=!menu.hidden;refreshModelOptions();return}if(button.dataset.modelId){selectedChatModel=chatModels.find(m=>m.id===button.dataset.modelId);document.querySelector('[data-selected-model]').textContent=selectedChatModel.id;document.querySelector('[data-model-menu]').hidden=true;refreshModelOptions();return}if(button.hasAttribute('data-mention-toggle')){openMentions(true);return}if(button.dataset.mentionSource){mentionSource=button.dataset.mentionSource;mentionIndex=0;document.querySelectorAll('[data-mention-source]').forEach(b=>b.classList.toggle('active',b===button));renderMentions();return}if(button.dataset.referenceId){referenceFile(button.dataset.referenceId);return}if(button.hasAttribute('data-reference-current')){referenceFile(media[0].id);return}if(button.hasAttribute('data-add'))document.getElementById('filePicker').click();if(button.hasAttribute('data-remove')){const attachment=button.closest('[data-attachment]');document.querySelectorAll('[data-mention-id]').forEach(chip=>{if(chip.dataset.mentionId===attachment.dataset.fileId)chip.remove()});attachment.remove();updateScope()}if(button.hasAttribute('data-mode')){if(button.dataset.mode==='visual'&&selectedChatModel.textOnly){toast('请先选择支持图片／视频理解的模型，再复核画面。');return}activeMode=button.dataset.mode;button.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));refreshModelOptions()}if(button.dataset.prompt)document.querySelector('[data-editor]').textContent=button.dataset.prompt;if(button.hasAttribute('data-send'))toast(`交互原型：使用 ${selectedChatModel.id}，引用 ${scopeIds().size} 项媒体；当前不发送。`);if(button.hasAttribute('data-apply'))toast('交互原型：这里将写回已确认的媒体资料，当前未执行保存。');if(button.hasAttribute('data-task-list'))toast('任务入口将承接批量理解、补建索引以及执行进度。')});
document.addEventListener('input',e=>{if(e.target.hasAttribute('data-mention-filter')){mentionIndex=0;renderMentions()}if(e.target.hasAttribute('data-editor')){const match=e.target.textContent.match(/(?:^|\s)@([^\s@]*)$/);if(match){document.querySelector('[data-mention-filter]').value=match[1];openMentions()}updateScope()}});
document.addEventListener('change',e=>{const attachment=e.target.closest('[data-attachment]');if(attachment&&e.target.type==='checkbox'){if(!e.target.checked)document.querySelectorAll('[data-mention-id]').forEach(chip=>{if(chip.dataset.mentionId===attachment.dataset.fileId)chip.remove()});updateScope()}});
document.addEventListener('keydown',e=>{const menu=document.querySelector('[data-mention-menu]');if(menu&&!menu.hidden){if(['ArrowDown','ArrowUp','Enter','Tab','Escape'].includes(e.key)){e.preventDefault();e.stopPropagation();if(e.key==='Escape'){hideMentions();document.querySelector('[data-editor]').focus();return}const count=menu.querySelectorAll('[data-reference-id]').length;if(e.key==='Enter'||e.key==='Tab'){menu.querySelector('.mention-result.active')?.click();return}if(count){mentionIndex=(mentionIndex+(e.key==='ArrowDown'?1:-1)+count)%count;renderMentions()}return}}if(e.key==='Escape'){const models=document.querySelector('[data-model-menu]');if(models&&!models.hidden){models.hidden=true;return}const dialog=document.querySelector('.chat-window');if(dialog&&!dialog.hidden)dialog.hidden=true}});
const dragTitle=document.querySelector('[data-drag-title]');let dragging;
dragTitle?.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;const dialog=document.querySelector('.chat-window');if(dialog.classList.contains('expanded'))return;const r=dialog.getBoundingClientRect();dragging={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top};dragTitle.setPointerCapture(e.pointerId);e.preventDefault()});
dragTitle?.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==dragging.id)return;const dialog=document.querySelector('.chat-window');dialog.style.left=Math.max(8,Math.min(innerWidth-dialog.offsetWidth-8,dragging.left+e.clientX-dragging.x))+'px';dialog.style.top=Math.max(36,Math.min(innerHeight-50,dragging.top+e.clientY-dragging.y))+'px';constrainDialog()});
function stopTitleDrag(e){if(!dragging||e.pointerId!==dragging.id)return;dragging=undefined;if(dragTitle.hasPointerCapture(e.pointerId))dragTitle.releasePointerCapture(e.pointerId)}
dragTitle?.addEventListener('pointerup',stopTitleDrag);dragTitle?.addEventListener('pointercancel',stopTitleDrag);
function constrainDialog(){const dialog=document.querySelector('.chat-window');if(!dialog||dialog.hidden)return;let rect=dialog.getBoundingClientRect();if(!dialog.classList.contains('expanded')){dialog.style.left=Math.max(8,Math.min(rect.left,innerWidth-Math.min(rect.width,innerWidth-20)-12))+'px';dialog.style.top=Math.max(36,Math.min(rect.top,innerHeight-Math.min(rect.height,innerHeight-48)-12))+'px';rect=dialog.getBoundingClientRect()}dialog.style.maxWidth=Math.max(0,innerWidth-rect.left-12)+'px';dialog.style.maxHeight=Math.max(0,innerHeight-rect.top-12)+'px'}
constrainDialog();window.addEventListener('resize',constrainDialog);document.addEventListener('click',e=>{if(e.target.closest('[data-open-chat],[data-expand-chat]'))constrainDialog()});
document.querySelectorAll('[data-drop]').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drop-active')});zone.addEventListener('dragleave',()=>zone.classList.remove('drop-active'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drop-active');toast(`已拖入 ${e.dataTransfer.files.length} 个文件（原型演示，不上传）。`)})});
document.getElementById('filePicker')?.addEventListener('change',e=>toast(`已选择 ${e.target.files.length} 个文件（原型演示，不上传）。`));
</script>
