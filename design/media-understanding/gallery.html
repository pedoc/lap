<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lap AI 设计图总览</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* finesse · register=product · A=existing-review-palette · B=system-CJK · C=image-gallery
     * D=none · E=review-cards · SOUL=2 SPECTACLE=0 DENSITY=6 */
    body{padding:42px 36px 64px;max-width:1500px;margin:auto}a{color:var(--accent);text-decoration:none}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:32px}h1{font-size:25px;margin-bottom:10px}header p{font-size:13px;color:var(--ink-3);max-width:900px;line-height:1.9}
    section{margin-top:34px}h2{font-size:17px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    article{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}article img{display:block;width:100%;aspect-ratio:1.6;object-fit:contain;background:var(--page)}article>div{padding:16px 18px}h3{font-size:14px}article p{font-size:12px;color:var(--ink-3);line-height:1.8;margin:8px 0 13px}.links{display:flex;gap:20px;font-size:12px}
    .scope{border:1px solid var(--border);padding:13px 16px;border-radius:8px;color:var(--ink-3);font-size:12px;line-height:1.9}
    @media(max-width:850px){body{padding:24px 16px}.cards{grid-template-columns:minmax(0,1fr)}header{display:block}header>a{display:inline-block;margin-top:16px}}
  </style>
</head>
<body>
  <header><div><h1>Lap AI · 按当前界面修订的设计稿</h1><p>先看现有设置布局，再看 AI 扩展。设置复用当前 Vue 模板与样式，按附图 1437×833 浅色窗口展示，原左侧导航和任务表单保持原位；媒体理解、多选处理和搜索沿用当前组件位置。所有模型能力与任务数据均为示例。</p></div><a href="index.html?screen=models">打开交互原型 →</a></header>
  <div class="scope">范围：产品设计与开发蓝图。图片只包含应用窗口；<a href="NOTES.md">设计说明单独查看</a>。当前布局图为源码重建，模型调用、下载、数据库写入均为模拟。业务边界见 <a href="SPEC.md">SPEC.md</a>，现状证据见 <a href="BASELINE.md">BASELINE.md</a>。</div>
  <main id="gallery"></main>
  <script src="model-data.js"></script>
  <script>
    const groups=[...new Set(SCREENS.map(s=>s.group))];
    document.getElementById('gallery').innerHTML=groups.map(g=>`<section><h2>${g}</h2><div class="cards">${SCREENS.filter(s=>s.group===g).map(s=>`<article><a href="index.html?screen=${s.id}${s.query?'&'+s.query:''}"><img src="${s.file}" alt="${s.title}" loading="lazy"></a><div><h3>${s.title}</h3><p>${s.caption}</p><div class="links"><a href="index.html?screen=${s.id}${s.query?'&'+s.query:''}">交互预览 →</a><a href="${s.file}">查看原图</a></div></div></article>`).join('')}</div></section>`).join('');
  </script>
</body>
</html>
