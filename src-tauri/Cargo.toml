[package]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
name = "Lap"
version = "0.4.10"
description = "An offline-first photo manager for large local libraries."
homepage = "https://julyx10.github.io/lap"
repository = "https://github.com/pedoc/lap"
authors = ["julyx10 <tiangle@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[dependencies]
drag = { path = "vendor/drag" }
tauri = { version = "2", features = [
    "macos-private-api",
    "protocol-asset",
] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-aptabase = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled", "collation"] }
chrono = "0.4"
rstar = "0.12"
csv = "1"
dirs = "5.0.1"
walkdir = "2.5.0"
trash = "3.3.1"
base64 = "0.22.1"
flate2 = "1"
http = "1"
image = "0.25.10"
quick-xml = "0.38.4"
png = "0.18.1"
kamadak-exif = "0.6.1"
little_exif = "0.6.23"
fast_image_resize = "5.1.0"
imagesize = "0.13.0"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "socks", "blocking"] }
genai = { version = "=0.7.0", default-features = false }
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
reqwest_ai = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
socket2 = "=0.6.3"
tempfile = "3.27"
opener = "0.7.2"
arboard = "3.6.1"
pinyin = "0.10.0"
once_cell = "1.21.4"
rand = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1.8.3"
sha2 = "0.10"
ring = "0.17.14"
md5 = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
jxl-oxide = { version = "0.12.5", features = ["image"] }
libc = "0.2"
hnsw_rs = "0.3.4"
lap-ai-runtime-wire = { path = "../crates/ai-runtime-wire" }
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
percent-encoding = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["coreml"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDictionary", "NSError", "NSLocale", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["directml"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
clipboard-win = "5.4.1"
windows = { version = "0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Wdk_Graphics_Direct3D"] }

[features]
# Legacy CUDA linkage for other platforms. Windows x64 uses the optional bridge
# and downloaded runtime without requiring this feature or a system CUDA Toolkit.
ai-cuda = ["ort/cuda"]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
